<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="0; url=https://www.imdiil.com/ia/">
  <link rel="canonical" href="https://www.imdiil.com/ia/">
  <title>Redirigiendo a IMDIIL</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; color: #fff; background: #111; }
    main { width: min(560px, calc(100% - 40px)); padding: 36px; border-left: 4px solid #f59d1a; }
    p { color: #bbb5ad; line-height: 1.6; }
    a { color: #111; background: #f59d1a; padding: 12px 18px; display: inline-block; border-radius: 999px; font-weight: 800; text-decoration: none; }
  </style>
  <script>
    window.location.replace("https://www.imdiil.com/ia/" + window.location.hash);
  </script>
</head>
<body>
  <main>
    <h1>Este curso ahora está en IMDIIL.</h1>
    <p>Te estamos llevando a su nueva ubicación oficial.</p>
    <a href="https://www.imdiil.com/ia/">Continuar a IMDIIL</a>
  </main>
